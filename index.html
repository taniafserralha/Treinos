<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Treinos 2026</title>
<style>
:root {
  --bg:#fffafc;
  --card:#ffffff;
  --text:#2a2327;
  --muted:#806f78;
  --border:#eadde3;
  --accent:#d889aa;
  --accent-dark:#b8678a;
  --accent-soft:#f7e7ee;
}

* { box-sizing:border-box; }

html, body {
  margin:0;
  padding:0;
  width:100%;
}

body {
  counter-reset: treinos;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:linear-gradient(180deg,#fffafc 0%,#fff 100%);
  color:var(--text);
  -webkit-text-size-adjust:100%;
}

.wrap {
  width:min(1100px, calc(100% - 24px));
  margin:0 auto;
  padding:22px 0 120px;
}

.hero, .month {
  background:var(--card);
  border:1px solid var(--border);
  border-radius:22px;
}

.hero {
  padding:28px;
  margin-bottom:18px;
}

.eyebrow {
  font-size:12px;
  font-weight:800;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--accent-dark);
  margin-bottom:10px;
}

h1 {
  margin:0;
  font-size:52px;
  line-height:.98;
  letter-spacing:-.04em;
}

.hero p {
  margin:16px 0 0;
  color:var(--muted);
  font-size:16px;
}

.months {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:18px;
}

.month {
  padding:20px;
}

.month-head {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:14px;
}

.month-head h2 {
  margin:0;
  font-size:24px;
}

.month-head span {
  color:var(--muted);
  font-size:13px;
}

.training-list {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}

.training {
  display:flex;
  align-items:center;
  gap:12px;
  min-height:54px;
  padding:12px 14px;
  border:1px solid var(--border);
  border-radius:14px;
  background:#fff;
  cursor:pointer;
  user-select:none;
  -webkit-tap-highlight-color:rgba(216,137,170,.15);
}

.training-check {
  position:absolute;
  opacity:0;
  width:1px;
  height:1px;
}

.box {
  width:26px;
  height:26px;
  flex:0 0 26px;
  border:2px solid var(--accent);
  border-radius:8px;
  background:#fff;
  display:grid;
  place-items:center;
}

.training-check:checked {
  counter-increment: treinos;
}

.training-check:checked + .box {
  background:var(--accent);
}

.training-check:checked + .box::after {
  content:"✓";
  color:#fff;
  font-size:17px;
  font-weight:900;
}

.training:has(.training-check:checked) {
  background:var(--accent-soft);
  border-color:var(--accent);
}

.date {
  font-size:15px;
  font-weight:800;
}

.progress {
  position:fixed;
  left:50%;
  bottom:12px;
  transform:translateX(-50%);
  width:min(720px, calc(100% - 20px));
  background:rgba(255,255,255,.96);
  border:1px solid var(--border);
  border-radius:18px;
  padding:14px 18px;
  box-shadow:0 10px 30px rgba(70,40,55,.12);
  backdrop-filter:blur(8px);
  z-index:100;
}

.progress-line {
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:10px;
}

.progress-count::before {
  content: counter(treinos) "/47";
  font-size:30px;
  font-weight:900;
  letter-spacing:-.03em;
}

.progress-label {
  color:var(--muted);
  font-size:13px;
}

.note {
  margin-top:6px;
  color:var(--accent-dark);
  font-size:13px;
  font-weight:700;
}

@media (max-width:800px) {
  .wrap {
    width:calc(100% - 16px);
    padding:14px 0 120px;
  }

  .hero {
    padding:18px;
    border-radius:18px;
  }

  h1 {
    font-size:38px;
  }

  .hero p {
    font-size:15px;
    line-height:1.45;
  }

  .months {
    grid-template-columns:1fr;
    gap:12px;
  }

  .month {
    padding:16px;
    border-radius:18px;
  }

  .training-list {
    grid-template-columns:1fr;
  }

  .training {
    min-height:60px;
    padding:14px;
  }

  .box {
    width:30px;
    height:30px;
    flex-basis:30px;
  }

  .date {
    font-size:17px;
  }

  .progress {
    bottom:8px;
    width:calc(100% - 16px);
    border-radius:16px;
  }
}
</style>
</head>
